{% extends "base.html" %}
{% block title %}New Bill{% endblock %}
{% block content %}
<h1>Generate Bill</h1>
<div class="card form-card">
<form method="post">
  <input type="hidden" name="appointment_id" value="{{ f.appointment_id or '' }}">
  <label>Patient</label>
  <select name="patient_id" required>
    <option value="">Select patient</option>
    {% for p in patients %}<option value="{{ p.id }}" {{ 'selected' if f.patient_id|string == p.id|string }}>{{ p.name }} ({{ p.phone }})</option>{% endfor %}
  </select>
  <label>Consultation Fee (₹)</label><input type="number" name="consultation_fee" min="0" step="0.01" value="{{ f.consultation_fee or 0 }}">
  <label>Medicine Charges (₹)</label><input type="number" name="medicine_charges" min="0" step="0.01" value="{{ f.medicine_charges or 0 }}">
  <label>Other Charges (₹) - tests, room, etc.</label><input type="number" name="other_charges" min="0" step="0.01" value="{{ f.other_charges or 0 }}">
  <button class="btn primary" type="submit">Generate Bill</button>
  <a class="btn" href="{{ url_for('billing') }}">Cancel</a>
</form>
</div>
{% endblock %}
